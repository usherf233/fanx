<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-label="工作区：会话侧栏与对话区">
  <defs>
    <clipPath id="win2"><rect x="0" y="0" width="1200" height="780" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#win2)">
    <rect width="1200" height="780" fill="#0E0E0F"/>

    <!-- top bar -->
    <rect x="0" y="0" width="1200" height="60" fill="#161618"/>
    <path d="M0 60H1200" stroke="#2A2A2E"/>
    <g transform="translate(24 20)">
      <rect x="0" y="0" width="18" height="18" fill="#F4713A"/>
      <text x="30" y="15" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="15" font-weight="700" fill="#F3F0EA">前端工程师</text>
      <path d="M160 4l5 6h-10z" fill="#93908A"/>
    </g>
    <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" letter-spacing="1.3">
      <text x="214" y="35" fill="#615F5B">对话</text>
      <text x="266" y="35" fill="#615F5B">模型</text>
      <text x="318" y="35" fill="#615F5B">配置</text>
      <text x="370" y="35" fill="#615F5B">资源库</text>
      <rect x="214" y="44" width="24" height="2" fill="#F4713A"/>
    </g>
    <g transform="translate(1046 21)">
      <circle cx="4" cy="9" r="4" fill="#4CC38A"/>
      <text x="16" y="13" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#615F5B">DAEMON OK</text>
    </g>

    <!-- sidebar -->
    <rect x="0" y="60" width="300" height="720" fill="#131315"/>
    <path d="M300 60V780" stroke="#2A2A2E"/>
    <text x="24" y="98" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#615F5B">SESSIONS</text>
    <rect x="24" y="112" width="252" height="32" rx="4" fill="#1F1F22" stroke="#3D3D43"/>
    <text x="150" y="133" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" letter-spacing="1.4" fill="#F3F0EA">+ NEW SESSION</text>

    <!-- session rows -->
    <g font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif">
      <rect x="12" y="164" width="276" height="52" rx="4" fill="#1F1F22"/>
      <rect x="12" y="164" width="2" height="52" fill="#F4713A"/>
      <text x="28" y="184" font-size="13" font-weight="600" fill="#F3F0EA">修复会话切换时序问题</text>
      <text x="28" y="203" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#615F5B">19:42 · 24 条</text>

      <text x="28" y="244" font-size="13" fill="#93908A">Markdown 增量解析</text>
      <text x="28" y="263" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#615F5B">18:10 · 61 条 · 预览</text>

      <text x="28" y="300" font-size="13" fill="#93908A">资源库批量启停</text>
      <text x="28" y="319" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#615F5B">昨天 · 12 条 · 预览</text>

      <text x="28" y="356" font-size="13" fill="#93908A">空会话铭牌布局</text>
      <text x="28" y="375" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#615F5B">昨天 · 8 条 · 预览</text>

      <text x="28" y="412" font-size="13" fill="#93908A">模型探测与定价换算</text>
      <text x="28" y="431" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" fill="#615F5B">11-12 · 33 条 · 预览</text>
    </g>

    <!-- chat area -->
    <g>
      <!-- user bubble -->
      <rect x="396" y="100" width="620" height="76" rx="6" fill="#1F1F22"/>
      <text x="420" y="126" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.3" fill="#615F5B">YOU</text>
      <text x="420" y="152" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="14" fill="#F3F0EA">会话切换时前端还在收上一个会话的 delta，怎么收敛？</text>

      <!-- assistant -->
      <text x="396" y="212" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.3" fill="#F4713A">ASSISTANT</text>
      <text x="396" y="244" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="14" fill="#F3F0EA">三个地方要一起改：</text>

      <text x="396" y="276" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="14" fill="#F3F0EA">1. SSE 订阅带上期望会话，后端给每个事件附 sessionId</text>
      <text x="396" y="302" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="14" fill="#F3F0EA">2. 所有异步回调带 epoch，迟到响应直接丢弃</text>
      <text x="396" y="328" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="14" fill="#F3F0EA">3. 只读预览走 JSONL，不碰 runtime</text>

      <!-- code block -->
      <rect x="396" y="352" width="700" height="168" rx="6" fill="#08080A" stroke="#2A2A2E"/>
      <text x="416" y="376" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.2" fill="#615F5B">TYPESCRIPT</text>
      <text x="1064" y="376" text-anchor="end" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.2" fill="#615F5B">COPY</text>
      <g font-family="'IBM Plex Mono', Consolas, monospace" font-size="12.5">
        <text x="416" y="404" fill="#615F5B">11</text>
        <text x="442" y="404" fill="#F4713A">if</text>
        <text x="464" y="404" fill="#F3F0EA">(ev.sessionId !== want) </text>
        <text x="628" y="404" fill="#F4713A">return</text>
        <text x="670" y="404" fill="#93908A">;</text>
        <text x="416" y="428" fill="#615F5B">12</text>
        <text x="442" y="428" fill="#93908A">// 迟到的事件按 sessionId 丢弃</text>
        <text x="416" y="452" fill="#615F5B">13</text>
        <text x="442" y="452" fill="#F3F0EA">emit(</text>
        <text x="486" y="452" fill="#4CC38A">'delta'</text>
        <text x="534" y="452" fill="#F3F0EA">, ev);</text>
        <text x="416" y="476" fill="#615F5B">14</text>
        <text x="442" y="476" fill="#93908A">// 换 Agent 时 epoch 自增，旧响应自然失效</text>
        <text x="416" y="500" fill="#615F5B">15</text>
        <text x="442" y="500" fill="#F4713A">if</text>
        <text x="464" y="500" fill="#F3F0EA">(epoch !== _agentEpoch) </text>
        <text x="660" y="500" fill="#F4713A">return</text>
        <text x="702" y="500" fill="#93908A">;</text>
      </g>

      <!-- streaming hint -->
      <circle cx="402" cy="558" r="3" fill="#F4713A"/>
      <text x="414" y="562" font-family="'IBM Plex Mono', Consolas, monospace" font-size="11" fill="#615F5B">streaming · 1.2s</text>

      <!-- composer -->
      <rect x="396" y="596" width="752" height="96" rx="8" fill="#161618" stroke="#2A2A2E"/>
      <text x="420" y="630" font-family="'IBM Plex Sans','Microsoft YaHei UI',sans-serif" font-size="13.5" fill="#615F5B">发消息给 前端工程师…</text>
      <rect x="1040" y="652" width="88" height="28" rx="4" fill="#F4713A"/>
      <text x="1084" y="671" text-anchor="middle" font-family="'IBM Plex Mono', Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#1A0B04">SEND</text>
      <text x="420" y="676" font-family="'IBM Plex Mono', Consolas, monospace" font-size="9.5" letter-spacing="1.1" fill="#615F5B">ENTER 发送 · SHIFT+ENTER 换行</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="779" rx="12" fill="none" stroke="#2A2A2E"/>
</svg>
