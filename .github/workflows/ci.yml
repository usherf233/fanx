name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon · typecheck & isolation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run scripts/poc-isolation.ts

  # 这个项目 Windows 桌面优先，界面断言的是中文排版不溢出；
  # 因此放在 windows runner 上跑，与开发机一致。
  app:
    name: app · analyze & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # 固定 SDK 版本：stable 会随时间漂移，新 SDK 的 deprecated 提示
      # 会让 flutter analyze 直接失败。本地开发用同一个版本。
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - run: flutter pub get

      # 失败时把真实报错写成 CI 注解，省得去翻日志
      - name: flutter analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log || {
            grep -E "error|warning|info •" analyze.log | head -8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      # 本机代理会拦掉 flutter_tester 的 WebSocket 握手
      - name: flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log || {
            tail -n 25 test.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }
        env:
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
