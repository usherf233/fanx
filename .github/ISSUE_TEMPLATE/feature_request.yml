name: 功能建议
description: 提出新的能力或交互改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景，而不是直接给方案。这样更容易判断是不是该由这个项目解决。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - Agent 管理
        - 资源库（技能 / 扩展 / 提示词）
        - 对话区
        - 模型接入
        - daemon / API
        - 其他
    validations:
      required: true
